[build]
  command = "npm install && npm run build && npm run migrate"
  publish = "dist"

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "EMAIL_FROM"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/health"
  to = "/.netlify/functions/api/health"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
